name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run lint

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Create .env file for CI
        run: |
          echo "ADMIN_USERNAME=${ADMIN_USERNAME:-admin}" > .env
          echo "ADMIN_PASSWORD=${ADMIN_PASSWORD:-test-admin-password}" >> .env
          echo "OPENCODE_SERVER_URL=${OPENCODE_SERVER_URL:-http://127.0.0.1:4096}" >> .env
          echo "OPENCODE_SERVER_PASSWORD=${OPENCODE_SERVER_PASSWORD:-test-server-password}" >> .env
          echo "GITHUB_WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET:-test-webhook-secret}" >> .env
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          OPENCODE_SERVER_PASSWORD: ${{ secrets.OPENCODE_SERVER_PASSWORD }}
          GITHUB_WEBHOOK_SECRET: ${{ secrets.GITHUB_WEBHOOK_SECRET }}
      - name: Validate compose file syntax
        run: docker compose config --quiet
      - name: Build and start services
        run: docker compose up -d --build
      - name: Wait for service to be healthy
        run: |
          echo "Waiting for service to start..."
          for i in $(seq 1 30); do
            HTTP_CODE=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000 2>/dev/null || echo "000")
            if [ "$HTTP_CODE" != "000" ]; then
              echo "Service is up! (HTTP status: $HTTP_CODE)"
              docker compose ps
              exit 0
            fi
            sleep 2
          done
          echo "Service failed to start within timeout"
          docker compose logs
          exit 1
      - name: Cleanup
        if: always()
        run: docker compose down
