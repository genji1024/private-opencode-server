name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run lint

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file syntax
        run: docker compose config --quiet
      - name: Build Docker images
        run: docker compose build
      # docker compose up -d はスキップする。
      # コンテナの起動には ADMIN_PASSWORD / OPENCODE_API_KEY などの
      # シークレット環境変数が必須だが、CI ではこれらを利用できないため。
      # ビルド検証のみで十分と判断する。
