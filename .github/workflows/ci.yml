name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run lint

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build

  # Verifies that opencode serve starts, stays running, and responds to requests
  opencode-serve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Start opencode serve in background
        run: bash .github/scripts/start-opencode-serve.sh
      - name: Verify server is reachable and stable
        run: bash .github/scripts/verify-opencode-serve.sh
      - name: Cleanup
        if: always()
        run: kill "$SERVER_PID" 2>/dev/null || true

  web-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - name: Start Next.js app and verify Web UI
        run: bash .github/scripts/verify-web-ui.sh
      - name: Cleanup
        if: always()
        run: kill "$NEXT_PID" 2>/dev/null || true

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Create .env file for CI
        run: bash .github/scripts/setup-env.sh
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          OPENCODE_SERVER_PASSWORD: ${{ secrets.OPENCODE_SERVER_PASSWORD }}
          GITHUB_WEBHOOK_SECRET: ${{ secrets.GITHUB_WEBHOOK_SECRET }}
      - name: Validate compose file syntax
        run: docker compose config --quiet
      - name: Build and start services
        run: docker compose up -d --build
      - name: Wait for service to be healthy
        run: bash .github/scripts/wait-for-health.sh http://localhost:3000 60
      - name: Cleanup
        if: always()
        run: docker compose down
