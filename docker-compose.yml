services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '${PORT:-3000}:3000'
    environment:
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - OPENCODE_SERVER_URL=http://opencode-srv:4096
      - OPENCODE_SERVER_PASSWORD=${OPENCODE_SERVER_PASSWORD}
      - GITHUB_WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET}
      - DATA_DIR=/tmp/opencode-server-data
    restart: unless-stopped
    depends_on:
      opencode-srv:
        condition: service_started
    volumes:
      - app-data:/tmp/opencode-server-data

  opencode-srv:
    build:
      context: .
      dockerfile: Dockerfile.opencode
    ports:
      - '4096:4096'
    environment:
      - OPENCODE_API_KEY=${OPENCODE_API_KEY}
      - GITHUB_PERSONAL_ACCESS_TOKEN=${GITHUB_PERSONAL_ACCESS_TOKEN}
      - STREAMABLE_HTTP_AUTH_TOKEN=${STREAMABLE_HTTP_AUTH_TOKEN}
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '--spider', 'http://localhost:4096']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  app-data:
