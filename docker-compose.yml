services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '${PORT:-3000}:3000'
    environment:
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - OPENCODE_SERVER_URL=${OPENCODE_SERVER_URL:-http://127.0.0.1:4096}
      - OPENCODE_SERVER_PASSWORD=${OPENCODE_SERVER_PASSWORD}
      - GITHUB_WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET}
      - DATA_DIR=/tmp/opencode-server-data
      # OpenCode AI Provider Configuration
      # Get your API key from https://opencode.ai
      - OPENCODE_API_KEY=${OPENCODE_API_KEY}
      # Optional: GitHub Personal Access Token for GitHub MCP server
      - GITHUB_PERSONAL_ACCESS_TOKEN=${GITHUB_PERSONAL_ACCESS_TOKEN}
      # Optional: Streamable HTTP Auth Token for GitLab MCP server
      - STREAMABLE_HTTP_AUTH_TOKEN=${STREAMABLE_HTTP_AUTH_TOKEN}
    restart: unless-stopped
    volumes:
      - app-data:/tmp/opencode-server-data

volumes:
  app-data:
